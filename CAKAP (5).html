<style>
:root{--bg:#e9f2ff;--card:#ffffff;--tx:#2e3a5e;--mu:#6f82ad;--pr:#337dff;--pr2:#9d66ff;--ok:#17c96f;--no:#ff6b6b;--bd:#dfe9fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#111a30;--card:#1a2440;--tx:#e8ecfb;--mu:#93a3c6;--bd:#2a3454;--pr:#6e95ff;--pr2:#a06bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.side{width:230px;background:linear-gradient(180deg,var(--pr),var(--pr2));color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.side h1{font-size:17px;margin:0 0 2px}.side small{opacity:.8}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin-top:4px}
.side button:hover,.side button.on{background:rgba(255,255,255,.2)}.main{flex:1;padding:22px;min-width:0;max-width:1000px}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;align-items:center}.side button{width:auto;margin:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
h2{margin:0 0 4px}h3{margin:0 0 8px}.mu{color:var(--mu)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:16px;padding:16px}.stat b{font-size:28px;display:block}
button.b,.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 15px;font:inherit;cursor:pointer}.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}.b.r{background:var(--no)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.sc{overflow-x:auto}.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--bd)}.tag.ok{background:#16a34a22;color:var(--ok)}.tag.no{background:#dc262622;color:var(--no)}
.bar{height:22px;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:8px;color:#fff;font-size:12px;padding:2px 8px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.step{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}.step:hover{border-color:var(--pr)}
.dot{width:26px;height:26px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:13px}.dot.d{background:var(--ok);color:#fff}
.login{max-width:400px;margin:8vh auto;padding:16px}.q{margin-bottom:14px}.q label{display:block;padding:6px 0;cursor:pointer}.q input{width:auto;margin:0 8px 0 0}
img,video{max-width:100%;border-radius:10px}.note{background:#f59e0b22;border-left:4px solid #f59e0b;padding:10px 12px;border-radius:8px;margin:8px 0}

.bub{background:var(--bd);padding:9px 14px;border-radius:16px 16px 16px 4px;margin:6px 0;max-width:88%;white-space:pre-wrap;width:fit-content}.bub small{display:block;opacity:.7;font-size:11px}
.bub.g{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}.bub.me{margin-left:auto;border-radius:16px 16px 4px 16px}
.tl{border-left:3px solid var(--bd);margin-left:13px;padding-left:16px}.tl .step{cursor:default}.tl .dot{cursor:pointer;margin-left:-30px;border:3px solid var(--card)}
pre.bh{white-space:pre-wrap;font:inherit;background:#f59e0b22;border-left:4px solid #f59e0b;padding:10px 12px;border-radius:8px}

.chat{display:grid;grid-template-columns:290px 1fr;gap:12px;height:calc(100vh - 150px);min-height:460px}.chat.one{grid-template-columns:1fr}
.cl,.cr{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:0}.cl .ls{overflow-y:auto;flex:1}
.ci{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center;border-bottom:1px solid var(--bd)}.ci:hover,.ci.on{background:var(--bd)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0}
.ci .tx{flex:1;min-width:0}.ci .tx b,.ci .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--no);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}.bk{display:none}
#msgs{flex:1;overflow-y:auto;padding:14px;background:linear-gradient(180deg,#7c8fd822,#337dff11)}
.cm{display:flex;gap:8px;margin:8px 0;align-items:flex-end}.cm.me{flex-direction:row-reverse}.cc{max-width:75%}
.cb{padding:9px 13px;border-radius:18px 18px 18px 4px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap;word-break:break-word}
.cm.me .cb{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:18px 18px 4px 18px}
.ct{font-size:11px;color:var(--mu);margin-top:2px}.cm.me .ct{text-align:right}.stk{font-size:56px;line-height:1.1}
.dsp{text-align:center;margin:12px 0}.dsp span{background:var(--bd);color:var(--mu);font-size:12px;padding:3px 12px;border-radius:99px}
.cf{border-top:1px solid var(--bd);padding:8px 10px}.qr{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.qr button{white-space:nowrap;border:1px solid var(--pr);background:none;color:var(--pr);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.em{display:flex;flex-wrap:wrap;gap:4px;padding:6px 0}.em button{background:none;border:0;font-size:22px;cursor:pointer}
.eye{position:absolute;right:6px;top:8px;background:none;border:0;font-size:18px;cursor:pointer}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:calc(100vh - 230px)}.chat.hl .cl{display:none}.chat:not(.hl):not(.one) .cr{display:none}.bk{display:inline-block}}
.rv{display:grid;grid-template-columns:290px 1fr;gap:12px;align-items:start}@media(max-width:760px){.rv{grid-template-columns:1fr}}.gc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-width:250px}.gn{font-size:34px;font-weight:700;line-height:1.1;margin:2px 0}.gn small{font-size:14px;color:var(--mu);font-weight:400}.gt{background:var(--bd);border-radius:10px;padding:8px 10px;margin:8px 0;white-space:pre-wrap;font-size:14px}.rq{font-size:12px;color:var(--mu);border-left:3px solid var(--pr);padding-left:8px;margin-bottom:4px}button,.b{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.b{min-height:38px;transition:transform .08s,filter .15s,opacity .15s}.b:hover{filter:brightness(1.1)}.b:active{transform:scale(.95)}.b:disabled{opacity:.5}
.b:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}.ci:active{filter:brightness(.95)}
.st2{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:box-shadow .2s}.st2.next{border-color:var(--pr)}.st2.open{box-shadow:0 4px 16px #337dff40}
.sh2{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}.sh2:hover{background:var(--bd)}.sh2 b{flex:1;font-weight:600}.sb2{padding:2px 14px 12px 48px}.sb2 p{margin:4px 0 10px}.chev{color:var(--mu);font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#1b2240;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center;box-shadow:0 6px 20px #0006}#toast.show{opacity:1;transform:translate(-50%,0)}
.mdl{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100}.mb{background:var(--card);color:var(--tx);padding:20px;border-radius:16px;max-width:340px;margin:16px}.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--card),var(--bd))}.hv{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 4px 14px #337dff55;flex-shrink:0}
.xb{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0}.xb div{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:99px;transition:width .6s}
.bdg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bd);filter:grayscale(1);opacity:.4}.bdg.on{filter:none;opacity:1;background:#f59e0b33}
.path{display:flex;align-items:center;overflow-x:auto;padding:12px 4px 6px;margin-top:6px}.nd{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bd);flex-shrink:0}.nd.d{background:var(--ok);color:#fff}.nd.nx{box-shadow:0 0 0 3px var(--pr);animation:pl 1.4s infinite}.ln{height:3px;width:24px;background:var(--bd);flex-shrink:0}.ln.d{background:var(--ok)}@keyframes pl{50%{box-shadow:0 0 0 8px #337dff22}}</style>

h2 .ico{width:22px;height:22px}
.pgh h2{margin:0}.pgh p{margin:3px 0 0;font-size:13.5px;color:#4d5f8d}
/* Kontras teks & tombol di atas latar */
:root{--mu:#5e709c}
.main>p.mu{color:#3d4f7c;font-weight:500}
.b.g{background:rgba(255,255,255,.72);color:#2f62c0;border-color:#b9d4fa;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
/* Sidebar terang & ringan */
.side{width:248px;background:linear-gradient(180deg,#ffffff,#f1f7ff 55%,#e9f1fe);border-right:1px solid #e0e9fa;box-shadow:6px 0 28px -18px rgba(60,120,255,.3);color:#44527e}
.side h1{font-size:16px;letter-spacing:.16em;color:#2e3a5e}
.side small{opacity:.75}
.side button{color:#4a5680;display:flex;gap:10px;align-items:center}
.side button span{flex:1;text-align:left}
.side button:hover{background:#dfeaff}
.side button.on{background:linear-gradient(135deg,#337dff,#9d66ff);color:#fff;box-shadow:0 8px 18px -8px rgba(51,125,255,.55)}
.slogo{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:1px solid #e3e9f8;margin-bottom:10px}
.slogo-i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 16px -8px rgba(51,125,255,.6)}
.slogo-i svg{width:27px;height:27px}
.slogo h1{margin:0;font-size:16px}
.slogo small{display:block;font-size:10.5px;letter-spacing:.03em}
.suser{display:flex;gap:10px;align-items:center;background:#e7f1ff;border:1px solid #d2e3fd;border-radius:14px;padding:9px 10px;margin:2px 0 12px}
.suser .av{width:36px;height:36px}
.suser .tx{flex:1;min-width:0}
.suser .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2e3a5e}
.suser .tx small{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav{display:flex;flex-direction:column}
.snav button{transition:background .15s,transform .15s,color .15s;text-align:left}
.snav .ico{width:19px;height:19px;opacity:.92}
.side button.snd{margin-top:auto;background:#e7f1ff;border:1px solid #d2e3fd;color:#4a5680}
.side button.snd:hover{background:#dfeaff}
@media(max-width:760px){.side{background:#fff;border-right:0;border-bottom:1px solid #e3e9f8;flex-direction:row;flex-wrap:wrap;align-items:center;padding-bottom:8px}.slogo{border:0;padding:2px 8px;margin:0}.suser{display:none}.snav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;width:100%;padding:2px 8px;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.snav::-webkit-scrollbar{display:none}.snav button{width:auto;flex:0 0 auto;white-space:nowrap;padding:8px 12px}.side button{width:auto}.side button.snd{margin-top:0;width:auto}}

:root[data-theme="dark"] .side{background:linear-gradient(180deg,#19213c,#1d2a4c);border-right-color:#2a3454;box-shadow:none;color:#ccd6ec}
:root[data-theme="dark"] .side h1{color:#e8ecfb}:root[data-theme="dark"] .side button{color:#9fb0d4}
:root[data-theme="dark"] .side button:hover{background:#243054}:root[data-theme="dark"] .slogo{border-bottom-color:#2a3454}
:root[data-theme="dark"] .suser{background:#212b50;border-color:#323d66}:root[data-theme="dark"] .suser .tx b{color:#e8ecfb}
:root[data-theme="dark"] .side button.snd{background:#212b50;border-color:#323d66;color:#9fb0d4}
/* Konten */
.main{margin:0 auto;max-width:1080px}
.main>*{animation:pageIn .45s cubic-bezier(.2,.7,.3,1) both}
.main>*:nth-child(2){animation-delay:.05s}.main>*:nth-child(3){animation-delay:.09s}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.card{transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 2px 12px -6px rgba(60,120,255,.13)}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 36px -18px rgba(60,120,255,.3);border-color:#cfdef5}
:root[data-theme="dark"] .card:hover{border-color:#3e4c84}
.cm{animation:pageIn .3s ease both}
table tr{transition:background .15s}table tr:hover{background:rgba(51,125,255,.07)}
input:focus,textarea:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(51,125,255,.18)}
/* Tombol, stat, progress */
.b{position:relative;overflow:hidden}
.b:hover{transform:translateY(-1px)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .55s ease-out both;pointer-events:none}
.b.g .rip{background:rgba(51,125,255,.25)}
@keyframes rip{to{transform:scale(1.15);opacity:0}}
.stat{background:linear-gradient(135deg,#d9ecff,#efe2ff);color:#44527e;border:1px solid #d4e4fd;position:relative;overflow:hidden}
.grid>.stat:nth-child(4n+1){background:linear-gradient(135deg,#d9ecff,#ecf6ff);border-color:#c9e2ff}
.grid>.stat:nth-child(4n+1) b{color:#2f7dff}.grid>.stat:nth-child(4n+1)::after{background:rgba(47,125,255,.13)}
.grid>.stat:nth-child(4n+2){background:linear-gradient(135deg,#ffe4f2,#fff1f8);border-color:#ffd0e6}
.grid>.stat:nth-child(4n+2) b{color:#f0569e}.grid>.stat:nth-child(4n+2)::after{background:rgba(240,86,158,.13)}
.grid>.stat:nth-child(4n+3){background:linear-gradient(135deg,#dcf8ec,#f0fdf7);border-color:#c4ecd8}
.grid>.stat:nth-child(4n+3) b{color:#12b37a}.grid>.stat:nth-child(4n+3)::after{background:rgba(18,179,122,.13)}
.grid>.stat:nth-child(4n+4){background:linear-gradient(135deg,#fff3d9,#fffaee);border-color:#ffe3ac}
.grid>.stat:nth-child(4n+4) b{color:#ef9f16}.grid>.stat:nth-child(4n+4)::after{background:rgba(239,159,22,.15)}
.stat b{font-size:26px;color:#2f7dff}
.stat::after{content:"";position:absolute;right:-22px;top:-22px;width:86px;height:86px;border-radius:50%;background:rgba(51,125,255,.1)}

:root[data-theme="dark"] .stat{background:linear-gradient(135deg,#212b50,#1d2748);border-color:#323d66;color:#ccd6ec}
:root[data-theme="dark"] .stat b{color:#7ea2ff}
.xb div{position:relative;overflow:hidden}
.xb div::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.5) 50%,transparent 75%);animation:shine 2.4s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* Hero siswa */
.hero{background:linear-gradient(120deg,#d9ecff 0%,#ffe0f0 52%,#fff4d8 100%)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#202a4e,#1e2545)}
.hv{background:rgba(255,255,255,.7);box-shadow:0 6px 18px -6px rgba(60,120,255,.38),inset 0 0 0 1px rgba(255,255,255,.6);overflow:hidden;animation:hvpop .5s cubic-bezier(.2,.7,.3,1.2) both}
@keyframes hvpop{from{transform:scale(.6);opacity:0}}

:root[data-theme="dark"] .hv{background:rgba(255,255,255,.08);box-shadow:0 6px 18px -6px rgba(0,0,0,.4)}
.hv img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bdg.on{box-shadow:0 0 0 3px rgba(240,185,92,.25);animation:bdgp 2.4s ease-in-out infinite}
@keyframes bdgp{50%{box-shadow:0 0 0 7px rgba(240,185,92,.12)}}
/* Beranda: kolom + rail kanan */
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.hrail{display:flex;flex-direction:column}
.hrail .card{margin-bottom:12px}
.rw{padding:16px}
.rh{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--tx)}
.rh .ico{color:#337dff}
.rstat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.rstat>div{background:var(--bd);border-radius:12px;padding:10px 4px}
.rstat b{display:block;font-size:20px;color:var(--pr)}
.rstat small{font-size:11px;color:var(--mu)}
.rrow{display:flex;gap:8px;align-items:center;padding:5px 0}
.rrow .av{width:28px;height:28px;font-size:12px}
.rrow .rnm{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rpos{width:22px;height:22px;border-radius:50%;background:var(--bd);color:var(--pr);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.rpos.top{background:linear-gradient(135deg,#efb65e,#f6d38e);color:#fff}
.rw.tip{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#e0f0ff,#ffe6f3)}
.rw.tip img{width:58px;height:70px;object-fit:cover;object-position:top;flex-shrink:0;border-radius:14px;animation:bob 3.6s ease-in-out infinite}
@media(max-width:1020px){.hgrid{grid-template-columns:minmax(0,1fr)}.hcol,.hrail{min-width:0}.hrail{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.hrail .card{margin-bottom:0}}
:root[data-theme="dark"] .rw.tip{background:linear-gradient(135deg,#212b50,#1d2748)}

.lbg::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(244,250,255,.55),rgba(255,240,250,.45) 48%,rgba(238,247,255,.52))}

:root[data-theme="dark"] .lbg::after{background:linear-gradient(155deg,rgba(12,19,40,.9),rgba(16,23,46,.88))}
.lblob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none;animation:lb 12s ease-in-out infinite alternate}
@keyframes lb{to{transform:translate(26px,-30px) scale(1.15)}}
.lcard{position:relative;z-index:2;width:min(880px,96vw);background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.65);border-radius:28px;box-shadow:0 34px 90px -34px rgba(60,90,200,.45);display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;animation:lpop .6s cubic-bezier(.2,.7,.3,1.05) both}

:root[data-theme="dark"] .lcard{background:rgba(17,25,48,.8);border-color:rgba(255,255,255,.08)}
@keyframes lpop{from{opacity:0;transform:translateY(24px) scale(.97)}}
.lbrand{padding:32px 30px;position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(51,125,255,.14),rgba(242,170,200,.15));display:flex;flex-direction:column}
.llogo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;box-shadow:0 10px 22px -10px rgba(51,125,255,.7)}
.llogo svg{width:31px;height:31px}
.lname{font-size:40px;font-weight:800;letter-spacing:.3em;margin:16px 0 4px;color:#2e3a5e}
.ltag{opacity:.85;margin:0 0 16px;font-size:13.5px;color:#4a5680}
.lmascot{display:flex;gap:12px;align-items:flex-end;margin-top:6px}
.lmascot img{width:148px;height:auto;filter:drop-shadow(0 16px 24px rgba(90,80,180,.35));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.lsay{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.55;backdrop-filter:blur(6px);margin-bottom:10px;color:#44527e}
.lfeat{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-top:auto;padding-top:14px}
.lfeat div{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);padding:6px 11px;border-radius:99px;transition:background .2s;color:#4a5680}
.lfeat div:hover{background:#fff}

:root[data-theme="dark"] .lsay{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#ccd6ec}
:root[data-theme="dark"] .lname{color:#e8ecfb}:root[data-theme="dark"] .ltag{color:#9fb0d4}
:root[data-theme="dark"] .lbrand{background:linear-gradient(160deg,rgba(51,125,255,.2),rgba(242,170,200,.12))}
:root[data-theme="dark"] .lfeat div{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#ccd6ec}
.lform{padding:34px 32px;display:flex;flex-direction:column;justify-content:center;background:rgba(255,255,255,.5)}
:root[data-theme="dark"] .lform{background:rgba(255,255,255,.03)}
.lform h2{margin:0 0 4px;font-size:23px}
.lform .b{margin-top:8px;width:100%;justify-content:center;display:flex;gap:8px;align-items:center}
@media(max-width:760px){.lcard{grid-template-columns:1fr;width:min(460px,94vw)}.lmascot img{width:90px}.lname{font-size:30px}.lbrand{padding:24px 22px}.lform{padding:24px 22px;background:transparent}}
/* Avatar transparan */
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avim{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle}
img.hvim{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pk{background:none;border:1px solid var(--bd);border-radius:14px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;color:var(--tx);transition:transform .15s,border-color .15s,box-shadow .15s}
.pk:hover{transform:translateY(-3px);border-color:var(--pr);box-shadow:0 8px 18px -8px rgba(51,125,255,.4)}
.pk img{width:54px;height:54px;object-fit:cover;border-radius:50%;background:#e9f2ff}
.pk span{font-size:11.5px;color:var(--mu)}
@media(max-width:520px){.pgrid{grid-template-columns:repeat(3,1fr)}}
/* Maskot pemandu */
.guide{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--card),var(--bd));border:1px solid var(--bd);border-radius:18px;padding:12px 16px;margin:0 0 14px;box-shadow:0 8px 24px -14px rgba(60,120,255,.32)}
.guide img{width:62px;height:74px;object-fit:cover;object-position:top;flex-shrink:0;border-radius:14px;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(60,120,255,.3))}
.gsay{flex:1;font-size:14px;line-height:1.55;position:relative;background:var(--bd);border-radius:12px;padding:10px 30px 10px 12px}
.gx{position:absolute;top:6px;right:8px;background:none;border:0;cursor:pointer;color:var(--mu);font-size:14px;padding:2px}
/* Chat natural */
.chat{display:grid;grid-template-columns:290px 1fr;gap:14px;height:calc(100vh - 180px);min-height:480px}.chat.one{grid-template-columns:1fr}
.cl,.cr{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 12px -6px rgba(60,120,255,.13)}.cl .ls{overflow-y:auto;flex:1}

${nx?`<div class="card rw"><div class="rh">${ic("clock")}<span>Lanjutkan belajar</span></div><b style="font-size:14px">${esc(nx.judul)}</b><p class="mu" style="font-size:12.5px;margin:3px 0 10px">${esc(tp0.judul)}</p><button class="b" onclick="goS('${tp0.id}','${nx.tipe}')">Mulai sekarang</button></div>`:""}
<div class="card rw"><div class="rh">${ic("rank")}<span>Peringkat kelas</span></div>${sw.map((s,i)=>`<div class="rrow"><span class="rpos ${i==0?"top":""}">${i+1}</span>${av(s.nama)}<b class="rnm">${esc(s.nama)}</b><small class="mu">${xp(s.id)} EXP</small></div>`).join("")||"<p class=mu>Belum ada data.</p>"}</div>
${fcard}
<div class="card rw tip"><img src="${AKT.guide}" alt=""><div><b>Tips Kak Rian</b><p style="font-size:12.5px;margin:2px 0 0">Kerjakan misi berurutan agar EXP naik cepat. Kalau bingung, tanya guru lewat menu Tanggapan ya.</p></div></div>`}

load();render();
</script></body></html>
